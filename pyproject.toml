[project]
name = "events-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "curl-cffi>=0.16.3",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "jinja2>=3.1.6",
    "pdfplumber>=0.11.10",
    "playwright>=1.63.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
    "selectolax>=0.4.13",
    "structlog>=26.1.0",
    "truststore>=0.10.4",
    "tzdata>=2026.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# campaigns and administrative notices are noise. Unmatched -> local LLM triage.
exclude_any:
  - Jagrook
  - awareness
  - Samajh Se Investing
  - opens a Local Office
  - Local Office
  - Quiz
  - Hindi Pakhwada
  - Swachhata
  - Special Campaign
  - recruitment
  - Officer Grade
  - holiday

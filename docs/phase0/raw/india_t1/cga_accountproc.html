    function ZoomTextOrig() {

        $('.some-class-name2').css({ 'font-size': '90%' });

    function ZoomInText() {
        document.cookie = "nrcc_zoom=0.9";
        //document.body.style.zoom = 1.2;
        document.body.style.fontSize = "0.9em";
        $('.some-class-name2').css({ 'font-size': '100%' });
        $('p').css({ 'font-size': '100%' });
        $('a').css({ 'font-size': '100%' });
    }
    function ZoomText() {
        var myzoom = getCookie('nrcc_zoom');

        if (myzoom == '0.7')
            ZoomOutText();
        else if (myzoom == '0.9')
            ZoomInText();
        else
            ZoomTextOrig();

    }

    function getCookie(c_name) {
        var c_value = document.cookie;
        var c_start = c_value.indexOf(" " + c_name + "=");
        if (c_start == -1) {
            c_start = c_value.indexOf(c_name + "=");
        }
        if (c_start == -1) {
            c_value = '';
        }
        else {
            c_start = c_value.indexOf("=", c_start) + 1;
            var c_end = c_value.indexOf(";", c_start);
            if (c_end == -1) {
                c_end = c_value.length;
            }
            c_value = unescape(c_value.substring(c_start, c_end));
        }
        return c_value;
    }

    $(document).ready(function () {
        ZoomText();

    });


</script>

<script type="text/javascript">
    function WaterMark(txtName, event) {
        var defaultText = " Enter Your Text";

        if (txtName.value.length == 0) {
            if (event.type == "blur") {
                txtName.style.color = "Gray";
                txtName.value = defaultText;
            }
        }
        // Condition to check textbox value and event type
        if (txtName.value == defaultText) {
            if (event.type == "focus") {
                txtName.style.color = "black";
                txtName.value = "";
            }
        }
    }
    var min = 8;
    var max = 18;
    function increaseFontSize() {
        var p = document.getElementsByTagName('p');
        for (i = 0; i < p.length; i++) {
            if (p[i].style.fontSize) {
                var s = parseInt(p[i].style.fontSize.replace("px", ""));
            } else {
                var s = 12;
            }
            if (s != max) {
                s += 1;
            }
            p[i].style.fontSize = s + "px"
        }
    }
    function decreaseFontSize() {
        var p = document.getElementsByTagName('p');
        for (i = 0; i < p.length; i++) {
            if (p[i].style.fontSize) {
                var s = parseInt(p[i].style.fontSize.replace("px", ""));
            } else {
                var s = 12;
            }
            if (s != min) {
                s -= 1;
            }
            p[i].style.fontSize = s + "px"
        }
    }
</script>

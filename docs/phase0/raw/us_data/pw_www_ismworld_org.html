<!DOCTYPE html><html lang="en"><head>      <meta charset="UTF-8">      <title>Oops!</title>      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">      <style>         * {         box-sizing: border-box;         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",         Roboto, Helvetica, Arial, sans-serif;         }         body {         margin: 0;         min-height: 100vh;         color: #1f2937;         background: #f3f4f6; /* optional, looks nicer */         }         .btm-row {         width: 100%;         background: #005195;         padding: 15px 24px;         }         /* Blue bar */         .top-row {         width: 100%;         background: #002F59;         padding: 15px 24px;         }         /* Wrapper that centers the card */         .page-content {         display: flex;         justify-content: center;         padding: 60px 20px;         }         /* Card stays the same */         .card {         background: #ffffff;         max-width: 720px;         width: 100%;         border-radius: 14px;         padding: 48px;         box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);         text-align: center;         }         h1 {         font-size: 32px;         margin: 0 0 16px;         color: #111827;         }         .subtitle {         font-size: 18px;         line-height: 1.6;         margin-bottom: 32px;         color: #4b5563;         }         .details {         text-align: center;         background: #f9fafb;         border-radius: 10px;         padding: 24px;         margin-bottom: 32px;         font-size: 15px;         color: #374151;         }         .details h2 {         font-size: 16px;         margin-top: 0;         margin-bottom: 8px;         color: #111827;         }         .details p {         margin: 0 0 16px;         }      </style>   </head>   <body>      <!-- Top bar -->      <div class="top-row">         <img src="https://www.ismworld.org/globalassets/masterpage/header/ism-logo-white.svg" alt="ISM Logo" style="max-width:150px;">      </div>      <!-- Centered content -->      <div class="page-content">         <div class="card">            <h1>Oops!</h1>            <p class="subtitle">               We can't seem to find the page you're looking for.            </p>            <div class="details">               <h2>Let's get you to where you need to go.</h2>               <p>                  Please call 480-752-6276 and select option 8 to reach Customer Service.               </p>            </div>         </div>      </div>      <!-- Bottom bar -->      <div class="btm-row">         <p>&nbsp;</p>      </div>   
</body></html>

name: windows

# Burst job for scheduled events (MPC, FOMC, CPI, ...). Dispatched by `tick` ~25 min
# before a window opens; polls each event at its window_poll_interval (20-60 s) while
# any window is open, then exits. One job covers overlapping windows.

on:
  workflow_dispatch:

concurrency:
  group: windows
  cancel-in-progress: false

env:
  EVENTS_BOT_DSN: ${{ secrets.EVENTS_BOT_DSN }}
  EVENTS_BOT_DB_SCHEMA: events_bot
  EVENTS_BOT_ARCHIVE: db
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  SMTP_FROM: ${{ secrets.SMTP_FROM }}
  EVENTS_BOT_RECIPIENTS: ${{ secrets.EVENTS_BOT_RECIPIENTS }}
  EVENTS_BOT_OPERATOR_EMAILS: ${{ secrets.EVENTS_BOT_OPERATOR_EMAILS }}
  DRY: ${{ vars.EVENTS_BOT_LIVE == 'true' && '' || '--dry-run' }}

jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - run: uv run python -m events_bot.ops.cli windows --max-minutes 330 $DRY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-${{ github.run_id }}
          path: |
            out/
            logs/
          if-no-files-found: ignore
          retention-days: 30

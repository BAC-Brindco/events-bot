# Source registry. Adding a source = an entry here + one adapter module under events_bot/sources.
# Every URL here must have been fetched successfully (build prompt rule 6); evidence in docs/FEED_MAP.md.
# Phase 1 registers only the RBI feeds that exercise the core loop; later phases add the rest.

sources:
  - id: rbi_pr
    label: RBI
    event_name: Press release
    country: IN
    tier: 1
    kind: stream
    feed_type: rss
    urls:
      press_releases: https://rbi.org.in/pressreleases_rss.xml
    poll_interval: 120          # 10-item feed, about a day deep (T-04); gaps backfilled by prid
    adapter: india.rbi:RbiRss
    filters:
      keywords: rbi_pr          # routine market operations / statistics out; everything else kept
    health_rules:
      expect: xml
      min_items: 5
      stale_after_hours: 72     # RBI posts every working day; long weekends ~3 days

  - id: rbi_notif
    label: RBI
    event_name: Notification
    country: IN
    tier: 1
    kind: stream
    feed_type: rss
    urls:
      notifications: https://rbi.org.in/notifications_rss.xml
    poll_interval: 300          # 10 items, about 9 days deep
    adapter: india.rbi:RbiRss
    health_rules:
      expect: xml
      min_items: 5
      stale_after_hours: 168

  - id: fomc
    label: FED
    event_name: FOMC decision
    country: US
    tier: 1
    kind: scheduled
    feed_type: html
    urls:
      calendar: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
    poll_interval: 43200        # calendar only; documents are polled in the event window
    window_poll_interval: 20    # statement/note/SEP post 14:00:14-14:00:33 ET (FEED_MAP)
    adapter: us.fed:Fomc
    stage2_eligible: true
    route: realtime             # SPEC: US real-time on FOMC days
    health_rules:
      expect: html

  - id: rbi_mpc
    label: RBI
    event_name: MPC decision
    country: IN
    tier: 1
    kind: scheduled
    feed_type: html
    urls:
      index: https://www.rbi.org.in/scripts/Annualpolicy.aspx
      press_releases: https://rbi.org.in/pressreleases_rss.xml
    poll_interval: 43200        # schedule only; the resolution is polled in the event window
    window_poll_interval: 20    # RSS + next-prid probes (Phase 0; 7 Oct capture decides the winner)
    adapter: india.rbi_mpc:RbiMpc
    stage2_eligible: true
    route: realtime
    health_rules:
      expect: html

  - id: pib
    label: PIB
    event_name: Government release
    country: IN
    tier: 1
    kind: stream
    feed_type: html
    urls:
      allrel: https://www.pib.gov.in/allRel.aspx?reg=3&lang=1
      rss: https://www.pib.gov.in/RssMain.aspx?ModId=6&Lang=1&Regid=3&reg=3
    poll_interval: 300
    adapter: india.pib:Pib
    filters:
      keywords: pib
      llm_triage: true          # undecided items go to the local LLM, else the EOD digest
    health_rules:
      expect: html
      min_items: 1
      stale_after_hours: 36     # PIB posts every day, incl. weekends

  - id: sebi_circ
    label: SEBI
    event_name: Circular / consultation
    country: IN
    tier: 1
    kind: stream
    feed_type: html
    urls:
      circulars: https://www.sebi.gov.in/sebiweb/home/HomeAction.do?doListing=yes&sid=1&ssid=7&smid=0
      consultation: https://www.sebi.gov.in/sebiweb/home/HomeAction.do?doListing=yes&sid=4&ssid=38&smid=35
    poll_interval: 600
    adapter: india.sebi:Sebi
    health_rules:
      expect: html
      min_items: 5
      stale_after_hours: 336   # circulars can pause for a week or two

  - id: sebi_pr
    label: SEBI
    event_name: Press release
    country: IN
    tier: 1
    kind: stream
    feed_type: html
    urls:
      press: https://www.sebi.gov.in/sebiweb/home/HomeAction.do?doListing=yes&sid=6&ssid=23&smid=0
    poll_interval: 600
    adapter: india.sebi:Sebi
    filters:
      keywords: sebi_pr
      llm_triage: true
    health_rules:
      expect: html
      min_items: 5
      stale_after_hours: 336

  - id: mospi
    label: MoSPI
    event_name: NSO release
    country: IN
    tier: 1
    kind: stream
    feed_type: api
    urls:
      releases: https://www.mospi.gov.in/api/latest-release/get-web-latest-release-list
    poll_interval: 900
    adapter: india.mospi:Mospi
    health_rules:
      expect: json
      min_items: 5
      stale_after_hours: 240

  - id: oea
    label: OEA
    event_name: Price / output release
    country: IN
    tier: 1
    kind: stream
    feed_type: html
    urls:
      home: https://eaindustry.nic.in/
    poll_interval: 900
    adapter: india.oea:Oea
    health_rules:
      expect: html
      min_items: 2
      stale_after_hours: 1000    # monthly releases

  - id: nse_surv
    label: NSE
    event_name: Surveillance lists
    country: IN
    tier: 1
    kind: stream
    feed_type: api
    urls:
      asm: https://www.nseindia.com/api/reportASM
      gsm: https://www.nseindia.com/api/reportGSM
      asm_page: https://www.nseindia.com/reports/asm
      gsm_page: https://www.nseindia.com/reports/gsm
    poll_interval: 900
    adapter: india.nse_surv:NseSurveillance
    health_rules:
      expect: json
      stale_after_hours: 120

  - id: nifty_indices
    label: NSE Indices
    event_name: Index changes
    country: IN
    tier: 1
    kind: stream
    feed_type: html
    urls:
      listing: https://www.niftyindices.com/press-release
    poll_interval: 900
    adapter: india.nifty_indices:NiftyIndices
    filters:
      keywords: nifty_indices
    health_rules:
      expect: html
      min_items: 20
      stale_after_hours: 336

  - id: cbdt
    label: CBDT
    event_name: Income-tax notification / circular
    country: IN
    tier: 1
    kind: stream
    feed_type: api
    urls:
      search: https://www.incometaxindia.gov.in/o/search/v1.0/search   # POST, curl_cffi (Akamai 403s httpx)
    poll_interval: 900
    adapter: india.cbdt:Cbdt
    filters:
      keywords: cbdt
    health_rules:
      expect: json
      min_items: 10
      stale_after_hours: 720    # notifications come in bursts, sometimes weeks apart

  - id: cbic
    label: CBIC
    event_name: GST / Customs / Excise notification
    country: IN
    tier: 1
    kind: stream
    feed_type: api
    urls:
      gst: https://taxinformation.cbic.gov.in/api/cbic-notification-msts/fetchUpdatesByTaxId/1000001
      customs: https://taxinformation.cbic.gov.in/api/cbic-notification-msts/fetchUpdatesByTaxId/1000002
      excise: https://taxinformation.cbic.gov.in/api/cbic-notification-msts/fetchUpdatesByTaxId/1000003
    poll_interval: 900
    adapter: india.cbic:Cbic
    filters:
      keywords: cbic
    health_rules:
      expect: json
      min_items: 3
      stale_after_hours: 720

  - id: bse_notices
    label: BSE
    event_name: Notice
    country: IN
    tier: 1
    kind: stream
    feed_type: api
    urls:
      notices: https://api.bseindia.com/BseIndiaAPI/api/getCurrPreNextNoticesData_New/w?flag=   # curl_cffi
    poll_interval: 900
    adapter: india.bse:BseNotices
    filters:
      keywords: bse
    health_rules:
      expect: json
      stale_after_hours: 96     # no notices on exchange holidays and weekends

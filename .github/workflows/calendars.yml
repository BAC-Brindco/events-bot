name: calendars

# Daily refresh of official calendars (FOMC, RBI MPC, BLS/BEA/Census, MoSPI, ...)
# into events_bot.events. `tick` reads them to launch burst jobs.

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"   # 06:00 IST
    - cron: "30 6 * * *"   # 12:00 IST
    - cron: "30 12 * * *"  # 18:00 IST, catches same-day calendar changes
    - cron: "30 18 * * *"  # 00:00 IST

permissions:
  actions: write
  contents: read

concurrency:
  group: calendars
  cancel-in-progress: false

env:
  EVENTS_BOT_DSN: ${{ secrets.EVENTS_BOT_DSN }}
  EVENTS_BOT_DB_SCHEMA: events_bot
  EVENTS_BOT_ARCHIVE: db
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  SMTP_FROM: ${{ secrets.SMTP_FROM }}
  EVENTS_BOT_OPERATOR_EMAILS: ${{ secrets.EVENTS_BOT_OPERATOR_EMAILS }}

jobs:
  calendars:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - run: uv run python -m events_bot.ops.cli calendar --days 21 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Arm burst jobs for events opening within 36 h
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python -m events_bot.ops.cli arm --hours 36 | while read -r ref start; do
            [ -z "$ref" ] && continue
            echo "armed $ref for $start" | tee -a "$GITHUB_STEP_SUMMARY"
            gh workflow run windows.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f start_utc="$start"
          done
      - name: Health (missed or unarmed events alert the operator)
        run: uv run python -m events_bot.ops.cli health | tee -a "$GITHUB_STEP_SUMMARY"

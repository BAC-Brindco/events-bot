      <script type="text/javascript">
            $(document).ready(function () {
                  function getParameterByName(name) {
                        var url = window.location.href;
                        name = name.replace(/[\[\]]/g, '\\$&');
                        var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)'),
                              results = regex.exec(url);
                        if (!results) return null;
                        if (!results[2]) return '';
                        return decodeURIComponent(results[2].replace(/\+/g, ' '));
                  }
                  // Get the IDs from the current page's URL
                  let prid = parseInt(getParameterByName('PRID'), 10);

                  if (!isNaN(prid) && prid > 0) {
                        $.ajax({
                              type: "POST",
                              url: "AjaxMethod.aspx/UpdatePRHitCount",
                              async: false,
                              data: JSON.stringify({ 'PermId': prid }),
                              contentType: "application/json; charset=utf-8",
                              dataType: "json",
                              success: function (response) {
                                    console.log(response);
                              },
                              error: function (error) {
                                    console.log("Error in AJAX request", error);
                              }
                        });
                  } else {
                        console.log("Invalid parameters:", prid);
                  }

            });
      </script>
      <style type="text/css">
            .table-responsive {
                  width: 100%;
                  overflow-x: auto;
            }

            .banner {
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                  background-color: #000;
                  color: #fff;
                  padding: 20px;
            }

            full-width {
                  width: 100%;
            }

            .logo-left, .logo-center, .countdown {
                  display: flex;
                  align-items: center;
            }

                  .logo-left img, .logo-center img {
                        height: 70px;
                  }

            .countdown {
                  text-align: center;
                  background-color: #444;
                  border-radius: 10px;
                  padding: 10px;
                  border: 2px solid grey;
            }

            .firstnumber {
                  color: #000000;
                  position: absolute;
                  top: 50px;
                  right: 90px;
                  font-size: 30px;
            }

            .secondnumber {
                  position: absolute;
                  color: #000000;
                  right: 45px;
                  top: 50px;
                  font-size: 30px;
            }

            .countdown .days {
                  font-size: 35px;
                  color: gold;
            }

            .countdown p {
                  margin: 0;
            }

            .countdown .text {
                  font-size: 16px;
            }

            a {
                  word-break: break-all;
            }

            iframe, img {
                  max-width: 100%;
            }

            @media(max-width:1199px) {
                  .firstnumber {
                        top: 40px;
                        right: 72px;
                        font-size: 30px;
                  }

                  .secondnumber {
                        right: 35px;
                        top: 40px;
                        font-size: 30px;
                  }
            }

            @media(max-width:990px) {
                  .firstnumber {
                        top: 25px;
                        right: 54px;
                        font-size: 30px;
                  }

                  .secondnumber {
                        right: 25px;
                        top: 25px;
                        font-size: 30px;
                  }
            }

            @media(max-width:768px) {
                  .countdown, .days {
                        font-size: 12px !important;
                  }


                  .firstnumber {
                        top: 25%;
                        right: 8%;
                        font-size: 30px;
                  }

                  .secondnumber {
                        right: 4.5%;
                        top: 25%;
                        font-size: 30px;
                  }
            }

            @media(max-width:475px) {
                  .countdown, .days {
                        font-size: 10px !important;
                        top: 20%;
                  }

                  .bannerimgdiv {
                        padding: 0 !important;
                  }

                  .bannerimg {
                        width: 108% !important;
                  }
            }
      </style>
